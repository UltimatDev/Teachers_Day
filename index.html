<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Teacher's Day — From Team Vidyut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Nunito:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --paper: #faf5ec;
      --paper-edge: #f0e5d3;
      --ink: #4a3229;
      --ink-soft: #8a6d5c;
      --rose: #c98a8f;
      --rose-deep: #a85c63;
      --sage: #93a683;
      --tape: #e7c9b8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: 'Nunito', sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(201, 138, 143, 0.10), transparent 45%),
        radial-gradient(circle at 85% 78%, rgba(147, 166, 131, 0.10), transparent 45%),
        var(--paper);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px 70px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* ---------- decorative doodle layer (monochrome, hand-drawn) ---------- */
    .doodles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .doodle {
      position: absolute;
      color: var(--ink-soft);
      opacity: .16;
    }

    .doodle svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .doodle.rose {
      color: var(--rose);
    }

    .doodle.sage {
      color: var(--sage);
    }

    .d1 {
      top: 6%;
      left: 7%;
      width: 34px;
      height: 34px;
      transform: rotate(-8deg);
    }

    .d2 {
      top: 14%;
      right: 9%;
      width: 26px;
      height: 26px;
      transform: rotate(10deg);
      opacity: .14;
    }

    .d3 {
      top: 34%;
      left: 4%;
      width: 22px;
      height: 22px;
      transform: rotate(-4deg);
    }

    .d4 {
      top: 46%;
      right: 5%;
      width: 30px;
      height: 30px;
      transform: rotate(6deg);
    }

    .d5 {
      top: 62%;
      left: 9%;
      width: 28px;
      height: 28px;
      transform: rotate(-12deg);
    }

    .d6 {
      top: 72%;
      right: 11%;
      width: 24px;
      height: 24px;
      transform: rotate(8deg);
    }

    .d7 {
      top: 85%;
      left: 14%;
      width: 20px;
      height: 20px;
      transform: rotate(4deg);
    }

    .d8 {
      top: 88%;
      right: 16%;
      width: 32px;
      height: 32px;
      transform: rotate(-6deg);
    }

    .d9 {
      top: 4%;
      left: 42%;
      width: 18px;
      height: 18px;
      transform: rotate(14deg);
    }

    .d10 {
      top: 52%;
      left: 46%;
      width: 16px;
      height: 16px;
      transform: rotate(-10deg);
      opacity: .10;
    }

    .d11 {
      top: 24%;
      left: 20%;
      width: 16px;
      height: 16px;
      transform: rotate(20deg);
      opacity: .12;
    }

    .d12 {
      top: 78%;
      right: 38%;
      width: 18px;
      height: 18px;
      transform: rotate(-16deg);
      opacity: .12;
    }

    @media (max-width:520px) {
      .doodles {
        opacity: .85;
      }
    }

    .scene {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hint {
      font-family: 'Caveat', cursive;
      font-size: 1.3rem;
      color: var(--ink-soft);
      margin-bottom: 22px;
      text-align: center;
      transition: opacity 0.4s ease;
    }

    .hint svg {
      display: block;
      margin: 6px auto 0;
      animation: bob 2.2s ease-in-out infinite;
    }

    @keyframes bob {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(5px);
      }
    }

    .stage {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    /* ---------- ENVELOPE ---------- */
    .envelope-view {
      position: relative;
      width: 280px;
      height: 186px;
      cursor: pointer;
      transition: opacity .6s ease, transform .6s ease;
      filter: drop-shadow(0 10px 20px rgba(90, 60, 45, 0.18));
    }

    .envelope-body {
      position: absolute;
      inset: 0;
      background: #fffaf2;
      border: 1px solid var(--paper-edge);
      border-radius: 6px;
      overflow: hidden;
    }

    .envelope-shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(201, 138, 143, 0.10), rgba(147, 166, 131, 0.06));
    }

    .flap-back {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 0;
      border-left: 140px solid transparent;
      border-right: 140px solid transparent;
      border-top: 110px solid #f3e6d8;
      z-index: 1;
    }

    .pocket-left {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 0;
      border-bottom: 88px solid #f6ede0;
      border-right: 140px solid transparent;
      z-index: 2;
    }

    .pocket-right {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 0;
      height: 0;
      border-bottom: 88px solid #f6ede0;
      border-left: 140px solid transparent;
      z-index: 2;
    }

    .flap-front {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 0;
      border-left: 140px solid transparent;
      border-right: 140px solid transparent;
      border-top: 92px solid #fdf6ea;
      transform-origin: top center;
      transform: rotateX(0deg);
      transition: transform .8s cubic-bezier(.6, .05, .28, 1);
      z-index: 5;
      filter: drop-shadow(0 3px 4px rgba(90, 60, 45, 0.10));
    }

    .wax {
      position: absolute;
      top: 76px;
      left: 50%;
      transform: translate(-50%, 0);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #cf7a80, var(--rose-deep) 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 6;
      box-shadow: 0 2px 4px rgba(90, 60, 45, 0.25);
      transition: opacity .3s ease, transform .3s ease;
    }

    .wax svg {
      width: 15px;
      height: 15px;
    }

    .peek {
      position: absolute;
      left: 50%;
      top: -14px;
      transform: translate(-50%, 0);
      width: 196px;
      height: 40px;
      background: var(--paper);
      border: 1px solid var(--paper-edge);
      border-radius: 3px 3px 0 0;
      z-index: 3;
      transition: opacity .3s ease;
    }

    .stage.open .envelope-view {
      opacity: .3;
      transform: scale(.92) translateY(8px);
      pointer-events: none;
    }

    .stage.open .flap-front {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .stage.open .wax {
      opacity: 0;
      transform: translate(-50%, 0) scale(.6);
    }

    .stage.open .peek {
      opacity: 0;
    }

    /* ---------- LETTER ---------- */
    .letter-view {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(-50%, 14px) scale(.9);
      width: min(94vw, 400px);
      max-height: min(76vh, 640px);
      overflow-y: auto;
      background: var(--paper);
      border: 1px solid var(--paper-edge);
      border-radius: 6px;
      box-shadow: 0 18px 40px rgba(90, 60, 45, 0.20);
      opacity: 0;
      pointer-events: none;
      transition: opacity .55s ease .2s, transform .55s cubic-bezier(.34, 1.2, .4, 1) .2s;
      z-index: 8;
      scrollbar-width: thin;
    }

    .stage.open .letter-view {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
      pointer-events: auto;
    }

    .letter-inner {
      padding: 40px 34px 34px;
      text-align: center;
    }

    .tape {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translate(-50%, 0) rotate(-3deg);
      width: 80px;
      height: 28px;
      background: var(--tape);
      opacity: .75;
      box-shadow: 0 1px 2px rgba(90, 60, 45, 0.12);
    }

    .tape::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.35) 0 2px, transparent 2px 6px);
    }

    .eyebrow {
      font-family: 'Caveat', cursive;
      font-size: 1.25rem;
      color: var(--rose-deep);
      margin: 8px 0 4px;
    }

    .headline {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 3.6rem;
      line-height: .95;
      color: var(--ink);
      margin: 6px 0 6px;
    }

    .headline span {
      color: var(--rose-deep);
    }

    .from-line {
      font-family: 'Caveat', cursive;
      font-size: 1.55rem;
      color: var(--sage);
      margin: 0 0 20px;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 16px 0 20px;
    }

    .divider .line {
      height: 1px;
      width: 50px;
      background: linear-gradient(90deg, transparent, var(--tape));
    }

    .divider .line.right {
      background: linear-gradient(90deg, var(--tape), transparent);
    }

    .divider svg {
      width: 14px;
      height: 14px;
      color: var(--rose);
    }

    .message {
      font-family: 'Nunito', sans-serif;
      font-size: 1.12rem;
      line-height: 1.75;
      color: var(--ink-soft);
      margin: 0 0 6px;
    }

    .message strong {
      color: var(--rose-deep);
      font-weight: 600;
    }

    .signoff {
      font-family: 'Caveat', cursive;
      font-size: 1.3rem;
      color: var(--ink-soft);
      margin-top: 20px;
      letter-spacing: .3px;
    }

    .flowers {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 20px;
    }

    .flowers svg {
      width: 24px;
      height: 24px;
    }

    .close-hint {
      margin-top: 30px;
      font-family: 'Caveat', cursive;
      font-size: 1.1rem;
      color: var(--ink-soft);
      opacity: .65;
      cursor: pointer;
      display: inline-block;
    }

    .close-hint:hover {
      opacity: 1;
    }

    /* reserve enough room in the stage so the open letter is never clipped */
    .stage-spacer {
      width: 1px;
      visibility: hidden;
      transition: height .3s ease;
    }

    .stage.open .stage-spacer {
      height: min(76vh, 640px);
    }

    .stage:not(.open) .stage-spacer {
      height: 186px;
    }

    @media (max-width:380px) {
      .envelope-view {
        width: 246px;
        height: 164px;
      }

      .flap-back,
      .flap-front {
        border-left-width: 123px;
        border-right-width: 123px;
      }

      .flap-back {
        border-top-width: 97px;
      }

      .flap-front {
        border-top-width: 81px;
      }

      .pocket-left,
      .pocket-right {
        border-bottom-width: 78px;
      }

      .pocket-left {
        border-right-width: 123px;
      }

      .pocket-right {
        border-left-width: 123px;
      }

      .wax {
        top: 66px;
      }

      .peek {
        width: 172px;
      }

      .headline {
        font-size: 2.9rem;
      }

      .letter-inner {
        padding: 32px 24px 28px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .flap-front,
      .letter-view,
      .envelope-view,
      .wax,
      .hint svg {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

          <div class="close-hint" id="close-hint">tuck it back in</div>
        </div>

  <script>
    const stage = document.getElementById('stage');
    const envelope = document.getElementById('envelope');
    const hint = document.getElementById('hint');
    const closeHint = document.getElementById('close-hint');

    function setOpen(open) {
      stage.classList.toggle('open', open);
      hint.style.opacity = open ? '0' : '1';
      if (open) { setTimeout(() => { stage.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50); }
    }

    envelope.addEventListener('click', () => setOpen(true));
    closeHint.addEventListener('click', (e) => { e.stopPropagation(); setOpen(false); });
  </script>
